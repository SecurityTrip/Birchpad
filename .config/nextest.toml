# cargo-nextest (https://nexte.st): each test in a process of its own, as many at once as the
# machine has cores: `cargo nextest run --workspace`. The crates have no doctests, which nextest
# would not run; examples are tests.

[profile.default]
# A test past a minute is reported as slow; one stuck for five is ended.
slow-timeout = { period = "60s", terminate-after = 5 }

# CI: every failure is reported rather than the first, and a stuck test is ended after ten.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 10 }
