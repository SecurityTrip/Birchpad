# The least share of lines each crate's tests must run, in percent (.github/coverage_floors.py,
# the coverage job of ci.yml). Floors only rise: when the job's summary says a crate is well
# over its floor, raise it with the change that added the tests. They sit a point or two under
# what was measured, as Linux runs other code than Windows and macOS.
#
# Measured on Windows on 2026-10-07: app 89.3, cli 92.1, commands 97.8, config 96.2, core 98.8,
# fuzz 97.8, io 97.6, menu-bar 96.8, release-tool 94.8, syntax 96.3, update 96.0, view 99.5.
# Measured on Windows on 2026-10-12: plugin 96.5, tools 98.6.
# Measured on Windows on 2026-10-13: i18n 97.2, editor 91.2, ui 95.5 (with the keymap, which moved
# in with the editor), app 88.1.
# After the dialogs' tests (Phase 6.21): app 90.5, commands 99.2, editor 92.8, plugin 97.2.
# Since 6.35 the tests are in each crate's tests folder, which cargo-llvm-cov leaves out: their
# own lines, all run, no longer count, so the shares are of the crates' code alone. Measured on
# Linux on 2026-10-19: plugin 95.7, release-tool 92.0 (the other crates kept over their floors).

[lines]
app = 89
cli = 90
commands = 98
config = 96
core = 97
editor = 91
fuzz = 96
i18n = 96
io = 95
menu-bar = 95
plugin = 95
release-tool = 92
