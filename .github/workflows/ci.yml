name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in our crates (cargo 1.97+ `build.warnings`).
  CARGO_BUILD_WARNINGS: deny

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          # Windows on ARM is a release target; keep it visible but non-blocking until it is green.
          - os: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # Debian's own libraries, the stable and the previous stable release: the Linux build is used
  # there as much as on Ubuntu.
  debian:
    name: test (debian ${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        release: [trixie, bookworm]
    runs-on: ubuntu-latest
    container: debian:${{ matrix.release }}
    steps:
      - name: Install build and GUI dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          # The checkout belongs to another user than the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The version and components of rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian-${{ matrix.release }}
      - run: cargo test --workspace --locked

  # Which code no test runs: a report per crate and per file in the run's summary, an lcov file
  # for tools, and for each crate a floor under the share of lines run that only ever rises
  # (.github/coverage-floors.toml; CONTRIBUTING.md, Tests).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev
      - name: Tests with coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Test the floor check
        run: python3 -m unittest discover -s .github -p "*_test.py"
      - name: Report
        run: |
          cargo llvm-cov report --json --summary-only > coverage.json
          {
            echo '## Test coverage by crate'
            python3 .github/coverage_floors.py < coverage.json || failed=1
            echo '## By file'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${failed:-0}"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # The built application in a real window (crates/app/tests/e2e.rs): start, open, edit, save,
  # quit, restore the session. Linux runs it on a virtual display with software Vulkan; Linux and
  # macOS stay non-blocking until they have been green on the runners.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install Linux GUI dependencies and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev xvfb mesa-vulkan-drivers
      - run: cargo clippy -p birchpad --features e2e --all-targets --locked
      - name: End-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a); else run=(); fi
          "${run[@]}" cargo test -p birchpad --features e2e --test e2e --locked

  # libFuzzer on everything that reads outside input (fuzz/, crates/fuzz): each target for a
  # minute from its seeds and from the corpus earlier runs grew. A crash fails the run and its
  # input is kept; fixed, it becomes a seed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # libFuzzer needs nightly; the checks themselves are tested on the pinned toolchain
          # (`cargo test -p birchpad-fuzz`), so new nightly warnings do not fail this job.
          toolchain: nightly
          rustflags: ""
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target
        # The prebuilt cargo-fuzz is a musl build, and builds for its own target unless told.
        run: |
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "fuzz/corpus/$target"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" -- -max_total_time=60 -timeout=10
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
