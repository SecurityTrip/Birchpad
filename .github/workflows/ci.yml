name: CI

# Every push to any branch is checked: a pull request with conflicts gets no pull_request run
# (GitHub cannot build its merge commit), and a branch without a pull request none at all.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in our crates (cargo 1.97+ `build.warnings`).
  CARGO_BUILD_WARNINGS: deny

jobs:
  fmt:
    # A pull request from this repository is checked by the push of its branch; those from
    # forks by the pull_request event.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    # As for fmt.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          # Windows on ARM is a release target; keep it visible but non-blocking until it is green.
          - os: windows-11-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # Debian's own libraries, the stable and the previous stable release: the Linux build is used
  # there as much as on Ubuntu.
  debian:
    name: test (debian ${{ matrix.release }})
    # As for fmt.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        release: [trixie, bookworm]
    runs-on: ubuntu-latest
    container: debian:${{ matrix.release }}
    steps:
      - name: Install build and GUI dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          # The checkout belongs to another user than the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The version and components of rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: debian-${{ matrix.release }}
      - run: cargo test --workspace --locked

  deny:
    # As for fmt.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
