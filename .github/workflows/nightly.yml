name: Nightly

# Builds the branch of the next version every night when it changed since the last nightly
# build, publishes it as a pre-release `v<version>-nightly.<date>.<run>`, adds it to the signed
# update manifest and keeps the ten newest nightly releases. The branch of the next version is the
# lowest `v<major>.<minor>.<patch>` branch without a release tag (after releasing v0.1.3 from
# branch v0.1.3, branch v0.1.4). A night without changes, or without such a branch, only signs the
# manifest again when it is a week old, so that it never expires. See
# docs/adr/0020-signed-updates-and-nightly-builds.md.
#
# The workflow itself runs on `main` (schedules always do), so that the manifest is signed in the
# context of the default branch; only the build jobs check out the branch's commit.
on:
  schedule:
    # 03:00 Moscow time (UTC+3); GitHub reads schedules in UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the branch did not change since the last nightly build.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      branch: ${{ steps.decide.outputs.branch }}
      commit: ${{ steps.decide.outputs.commit }}
    steps:
      - name: Only main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the nightly workflow on main; it finds the branch of the next version itself"
          exit 1
      - uses: actions/checkout@v7
        with:
          # The branches and tags, to find the branch of the next version, the last nightly build
          # and the released versions.
          fetch-depth: 0
      - name: Decide
        id: decide
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          branch=""
          for candidate in $(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V); do
            if ! git rev-parse -q --verify "refs/tags/$candidate" > /dev/null; then
              branch="$candidate"
              break
            fi
          done
          if [ -z "$branch" ]; then
            echo "::notice::No branch of an unreleased version (v<major>.<minor>.<patch>): nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(git rev-parse "refs/remotes/origin/$branch")
          base=$(git show "$head:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
          if [ "v$base" != "$branch" ]; then
            echo "::error::The workspace version on branch $branch is $base: raise it to ${branch#v}, so that nightly builds are pre-releases of the version being developed"
            exit 1
          fi
          last=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$head" ] && [ "$FORCE" != "true" ]; then
            echo "$branch has not changed since $last."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          {
            echo "build=true"
            echo "version=$version"
            echo "branch=$branch"
            echo "commit=$head"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version from $branch at $head."

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: nightly
      ref: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      REF: ${{ needs.prepare.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > "birchpad-$VERSION-SHA256SUMS.txt"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish the pre-release
        id: release
        shell: bash
        run: |
          tag="v$VERSION"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --prerelease --latest=false --title "Birchpad $VERSION" \
            --notes "Nightly build of $BRANCH at $REF. Nightly builds are untested snapshots; the per-user installer updates itself to newer nightly builds. They are not signed: [Code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)." \
            dist/*
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Keep the ten newest nightly releases
        shell: bash
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt --jq '.[] | select(.tagName | test("-nightly\\.")) | "\(.createdAt) \(.tagName)"' \
            | sort -r | tail -n +11 | while read -r _ tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done

  manifest:
    # After a new nightly build, add it; on a night without one, sign the manifest again if it is
    # a week old.
    needs: [prepare, publish]
    if: ${{ !cancelled() && (needs.prepare.outputs.build != 'true' || needs.publish.result == 'success') }}
    uses: ./.github/workflows/update-manifest.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      refresh-after-days: 7
    secrets: inherit
    permissions:
      contents: write
