name: Release

# Builds the release artifacts for a version tag and publishes them as a draft GitHub release,
# which a maintainer reviews and publishes; publishing it adds it to the signed update manifest
# (update-manifest.yml). See docs/adr/0009-releases-portable-mode-and-update-check.md and
# docs/adr/0020-signed-updates-and-nightly-builds.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the workspace version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $manifest"
            exit 1
          fi
          case "$version" in
            *-nightly*)
              echo "::error::Nightly builds come from the nightly workflow, not from tags"
              exit 1
              ;;
            *-beta*|*-rc*) channel=beta; prerelease=true ;;
            *-*) channel=nightly; prerelease=true ;;
            *) channel=stable; prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      # Windows files are signed when SignPath is set up (packaging/windows/signing).
      sign: true
      # MSI versions are numeric (major.minor.build); pre-releases get no MSI until there is a
      # mapping for them (ADR 0005).
      msi: ${{ needs.prepare.outputs.prerelease == 'false' }}

  publish:
    # Runs when nothing failed.
    if: ${{ !cancelled() && !failure() }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > "birchpad-$VERSION-SHA256SUMS.txt"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Release notes
        shell: bash
        # The version's section of CHANGELOG.md, or GitHub's generated notes without one, and
        # the code signing policy, which SignPath Foundation requires on download pages.
        run: |
          policy="https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
          if [ "$SIGNED" = "true" ]; then
            footer="Free code signing provided by SignPath.io, certificate by SignPath Foundation. [Code signing policy]($policy)"
          else
            footer="The Windows files of this release are not signed. [Code signing policy]($policy)"
          fi
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside && /^\[[^]]+\]: / { next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            printf '\n---\n\n%s\n' "$footer" >> notes.md
            echo "NOTES=--notes-file=notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes"
            printf '%s\n' "$footer" > notes.md
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag "$NOTES" --title "Birchpad $VERSION")
          if [ "$NOTES" = "--generate-notes" ]; then
            flags+=(--notes-file notes.md)
          fi
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/*
