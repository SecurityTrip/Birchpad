name: Release

# Builds the release artifacts for a version tag and publishes them as a draft GitHub release,
# which a maintainer reviews and publishes; publishing it adds it to the signed update manifest
# (update-manifest.yml). See docs/adr/0009-releases-portable-mode-and-update-check.md and
# docs/adr/0020-signed-updates-and-nightly-builds.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the workspace version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $manifest"
            exit 1
          fi
          case "$version" in
            *-nightly*)
              echo "::error::Nightly builds come from the nightly workflow, not from tags"
              exit 1
              ;;
            *-beta*|*-rc*) channel=beta; prerelease=true ;;
            *-*) channel=nightly; prerelease=true ;;
            *) channel=stable; prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}

  msi:
    # MSI versions are numeric (major.minor.build); pre-releases get no MSI until there is a
    # mapping for them (ADR 0005).
    if: needs.prepare.outputs.prerelease == 'false'
    needs: [prepare, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: bin-windows-x64
          path: bin
      - name: Install WiX
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          printf '%s\n' "$USERPROFILE\.dotnet\tools" >> "$GITHUB_PATH"
      - name: Build the MSI
        shell: bash
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          if [ "$major" -gt 255 ] || [ "$minor" -gt 255 ] || [ "$patch" -gt 65535 ]; then
            echo "::error::$VERSION cannot be an MSI version (major and minor < 256, build < 65536)"
            exit 1
          fi
          mkdir -p dist
          wix build packaging/windows/Birchpad.wxs -arch x64 \
            -d Version="$VERSION" -d BinDir="$(cygpath -w "$PWD/bin")" \
            -o "dist/birchpad-$VERSION-windows-x64.msi"
      - name: Sign (placeholder)
        shell: bash
        run: echo "::notice::Authenticode signing is not set up yet; the MSI is unsigned."
      - uses: actions/upload-artifact@v4
        with:
          name: dist-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    # Runs when nothing failed; the MSI job is skipped for pre-releases.
    if: ${{ !cancelled() && !failure() }}
    needs: [prepare, build, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > "birchpad-$VERSION-SHA256SUMS.txt"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Release notes
        shell: bash
        # The version's section of CHANGELOG.md, or GitHub's generated notes without one.
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside && /^\[[^]]+\]: / { next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            echo "NOTES=--notes-file=notes.md" >> "$GITHUB_ENV"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; using generated notes"
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag "$NOTES" --title "Birchpad $VERSION")
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/*
