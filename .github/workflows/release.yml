name: Release

# Builds the release artifacts for a version tag and publishes them as a draft GitHub release,
# which a maintainer reviews and publishes. See docs/adr/0009-releases-portable-mode-and-update-check.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the workspace version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $manifest"
            exit 1
          fi
          case "$version" in
            *-beta*|*-rc*) channel=beta; prerelease=true ;;
            *-*) channel=nightly; prerelease=true ;;
            *) channel=stable; prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            targets: aarch64-pc-windows-msvc
            # Non-blocking until Windows on ARM is green in CI.
            experimental: true
          - name: linux-x64
            # The oldest supported runner, so the binary runs on older glibc.
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            # Built for both architectures and combined into a universal binary.
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      BIRCHPAD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      BIRCHPAD_COMMIT: ${{ github.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.targets }}
          # Release builds never reuse caches that other workflows could have written.
          cache: false
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev zip
      - name: Build
        shell: bash
        run: |
          IFS=',' read -ra targets <<< "${{ matrix.targets }}"
          for target in "${targets[@]}"; do
            cargo build --release --locked -p birchpad --target "$target"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="birchpad-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$name" bin
          cp "target/${{ matrix.targets }}/release/birchpad.exe" "dist/$name/"
          cp "target/${{ matrix.targets }}/release/birchpad.exe" bin/
          cp packaging/portable/birchpad-portable.txt LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
      - name: Sign (placeholder)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Authenticode signing (SignPath Foundation, see ADR 0005) goes here and must sign
          # both dist/*/birchpad.exe and bin/birchpad.exe before they are packaged.
          echo "::notice::Authenticode signing is not set up yet; birchpad.exe is unsigned."
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          $name = "birchpad-$env:VERSION-${{ matrix.name }}"
          # The system's bsdtar writes zip files on every Windows runner, including ARM64.
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "$name.zip" $name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse $name

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="birchpad-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.targets }}/release/birchpad" "dist/$name/"
          cp packaging/portable/birchpad-portable.txt LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          cd dist
          zip -r "$name.zip" "$name"
          rm -r "$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="birchpad-$VERSION-${{ matrix.name }}"
          app="dist/$name/Birchpad.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/birchpad" \
            target/aarch64-apple-darwin/release/birchpad \
            target/x86_64-apple-darwin/release/birchpad
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          # Ad-hoc signature only. Developer ID signing and notarization (ADR 0005) replace it.
          codesign --force --deep --sign - "$app"
          echo "::notice::Developer ID signing and notarization are not set up yet; Birchpad.app is ad-hoc signed."
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
          rm -r "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      - name: Keep the Windows x64 binary for the MSI
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x64
          path: bin/birchpad.exe
          if-no-files-found: error

  msi:
    # MSI versions are numeric (major.minor.build); pre-releases get no MSI until there is a
    # mapping for them (ADR 0005).
    if: needs.prepare.outputs.prerelease == 'false'
    needs: [prepare, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: bin-windows-x64
          path: bin
      - name: Install WiX
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          printf '%s\n' "$USERPROFILE\.dotnet\tools" >> "$GITHUB_PATH"
      - name: Build the MSI
        shell: bash
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          if [ "$major" -gt 255 ] || [ "$minor" -gt 255 ] || [ "$patch" -gt 65535 ]; then
            echo "::error::$VERSION cannot be an MSI version (major and minor < 256, build < 65536)"
            exit 1
          fi
          mkdir -p dist
          wix build packaging/windows/Birchpad.wxs -arch x64 \
            -d Version="$VERSION" -d BinDir="$(cygpath -w "$PWD/bin")" \
            -o "dist/birchpad-$VERSION-windows-x64.msi"
      - name: Sign (placeholder)
        shell: bash
        run: echo "::notice::Authenticode signing is not set up yet; the MSI is unsigned."
      - uses: actions/upload-artifact@v4
        with:
          name: dist-msi
          path: dist/*.msi
          if-no-files-found: error

  sbom:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Generate the SBOM
        shell: bash
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all
          mkdir -p dist
          cp crates/app/birchpad.cdx.json "dist/birchpad-$VERSION-sbom.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sbom
          path: dist/*
          if-no-files-found: error

  publish:
    # Runs when nothing failed; the MSI job is skipped for pre-releases.
    if: ${{ !cancelled() && !failure() }}
    needs: [prepare, build, msi, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > "birchpad-$VERSION-SHA256SUMS.txt"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Birchpad $VERSION")
          if [ "${{ needs.prepare.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/*
