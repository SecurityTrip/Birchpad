# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Birchpad is MIT OR Apache-2.0; every dependency must be compatible with that.

[graph]
all-features = true
# The platforms Birchpad ships for; dependencies used only elsewhere (wasm, Android) are not
# checked.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Only crates we depend on directly are checked for being unmaintained; transitive ones (mostly
# under GPUI) are outside our control.
unmaintained = "workspace"
# zip 8.6, through Velopack 1.2.161 (the updater of per-user installs, built only for Windows),
# which requires zip ^8.6; the Velopack release with zip 9 is a pre-release so far. Velopack only
# extracts Birchpad's own update packages, checked against the size and SHA-256 in the signed
# manifest before it sees them, and these three concern Unix permission bits and symbolic links
# of attacker-controlled archives. Remove once Velopack ships zip 9 in a release.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "Unix SUID/SGID bits; Velopack runs on Windows, on signed packages only" },
    { id = "RUSTSEC-2026-0368", reason = "symbolic links of attacker-controlled archives; Velopack extracts signed packages only" },
    { id = "RUSTSEC-2026-0369", reason = "Unix permissions through symbolic links; Velopack runs on Windows, on signed packages only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    # BSD-style; used by the pure-Rust bzip2 port pulled in through GPUI's HTTP stack.
    "bzip2-1.0.6",
    # File-level copyleft: fine to depend on, but never copy MPL code into our crates.
    "MPL-2.0",
    # Mozilla's root certificates (webpki-roots), compiled in by the HTTP client of Velopack's
    # updater; Birchpad's own requests use the operating system's certificate store.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
