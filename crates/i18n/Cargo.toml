[package]
name = "birchpad-i18n"
description = "The languages of Birchpad's interface: YAML locales, texts by key with named arguments and plural forms, the current language. No UI."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
sys-locale = "0.3"
# The locale files are UTF-8 text, read without its encoding detection.
yaml-rust2 = { version = "0.13", default-features = false }

[features]
# The language is chosen for each thread, not for the process: tests that switch it run side by
# side (`set_language` in one test does not change another's). Only for tests.
per-thread = []

[lints]
workspace = true
