# A plugin for the tests of birchpad-plugin, built into ../probe.wasm (see build.md); also the
# smallest example of a plugin in Rust.
[package]
name = "probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1

# Not part of Birchpad's workspace.
[workspace]
