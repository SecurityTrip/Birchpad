[package]
name = "birchpad-editor"
description = "Birchpad's editor view: a document (the buffer), its text drawn and edited in GPUI, the active theme."
version = "0.7.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
birchpad-cli.workspace = true
birchpad-commands.workspace = true
birchpad-config.workspace = true
birchpad-core.workspace = true
birchpad-i18n.workspace = true
birchpad-io.workspace = true
birchpad-syntax.workspace = true
birchpad-theme.workspace = true
birchpad-tools.workspace = true
birchpad-ui.workspace = true
birchpad-view.workspace = true
gpui-kit = "0.7"
serde.workspace = true
serde_json.workspace = true

[features]
# What the application's tests read of the editor (its bounds, its folds, ...).
test-support = ["birchpad-ui/test-support"]

[dev-dependencies]
# What the tests read of the editor.
birchpad-editor = { path = ".", features = ["test-support"] }
birchpad-i18n = { workspace = true, features = ["per-thread"] }
birchpad-ui = { workspace = true, features = ["test-support"] }
gpui-kit = { version = "0.7", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
