[package]
name = "birchpad"
description = "Birchpad: a fast, extensible text editor in the spirit of Notepad++."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
birchpad-cli.workspace = true
birchpad-commands.workspace = true
birchpad-config.workspace = true
birchpad-core.workspace = true
birchpad-editor.workspace = true
birchpad-i18n.workspace = true
birchpad-io.workspace = true
birchpad-menu-bar.workspace = true
birchpad-plugin.workspace = true
birchpad-quick-pick.workspace = true
birchpad-search-results.workspace = true
birchpad-syntax.workspace = true
birchpad-theme.workspace = true
birchpad-tools.workspace = true
birchpad-tray.workspace = true
birchpad-ui.workspace = true
birchpad-update = { workspace = true, features = ["installer"] }
birchpad-view.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
gpui-kit = "0.7"
raw-window-handle = "0.6"
# PlantUML diagrams exported as PNG: the SVG renderer GPUI draws them with.
resvg = "0.46"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
notify = "8"
toml.workspace = true
trash = "5"

[features]
# Runs the script named by BIRCHPAD_E2E_SCRIPT once started, for the end-to-end tests
# (`cargo test -p birchpad --features e2e --test e2e`). Release builds leave it out.
e2e = ["birchpad-search-results/test-support"]
# What the tests drive and read of the application, and the system calls they fake: the
# integration tests (`tests/integration`) turn it on.
test-support = [
    "birchpad-editor/test-support",
    "birchpad-quick-pick/test-support",
    "birchpad-search-results/test-support",
    "birchpad-tray/test-support",
    "birchpad-ui/test-support",
]

# The Windows icon and version resources (build.rs); the version GPUI uses.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
birchpad = { path = ".", features = ["test-support"] }
birchpad-editor = { workspace = true, features = ["test-support"] }
birchpad-ui = { workspace = true, features = ["test-support"] }
# Tests switch the language each in its own thread.
birchpad-i18n = { workspace = true, features = ["per-thread"] }
gpui-kit = { version = "0.7", features = ["test-support"] }
# The map type of GPUI's keyboard mapper trait, for a test mapper.
rustc-hash = "2"
# The SHA-256 of an update package served in a test.
sha2 = "0.11"
tempfile = "3"
# The PlantUML packages served in tests; the version birchpad-update builds.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[lints]
workspace = true

# View > Always on Top, Edit > Paste Special > Paste HTML/RTF Content, File > Print, minimizing
# to the tray: the platforms' own calls.
[target.'cfg(windows)'.dependencies]
birchpad-print-dialog.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The version GPUI builds.
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The version GPUI uses (`.github/dependabot.yml`).
x11rb = "0.13"
