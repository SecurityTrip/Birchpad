[package]
name = "birchpad"
description = "Birchpad: a fast, extensible text editor in the spirit of Notepad++."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
birchpad-cli.workspace = true
birchpad-commands.workspace = true
birchpad-config.workspace = true
birchpad-core.workspace = true
birchpad-io.workspace = true
birchpad-menu-bar.workspace = true
birchpad-syntax.workspace = true
birchpad-update.workspace = true
birchpad-view.workspace = true
futures = "0.3"
gpui-kit = "0.7"
semver = "1"
serde.workspace = true
serde_json.workspace = true
notify = "8"

# Per-user installs update themselves with Velopack, on Windows (ADR 0020). The version matches
# the `vpk` tool the release workflows package with.
[target.'cfg(windows)'.dependencies]
velopack = { version = "=1.2.161", features = ["public-utils"] }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
# The map type of GPUI's keyboard mapper trait, for a test mapper.
rustc-hash = "2"
tempfile = "3"

[lints]
workspace = true
