# Интерфейс Birchpad на русском (ADR 0033): переводы ключей en.yaml. Ключ без перевода
# показывается по-английски. Множественное число: one (1, 21), few (2-4, 22), many (5-20, 0).
#
# Раздел `text` переводит английские фразы крейтов без окна (ошибки чтения файлов, настроек,
# поиска): `{}` — любая часть фразы, `{1}`, `{2}` — те же части в другом порядке.

