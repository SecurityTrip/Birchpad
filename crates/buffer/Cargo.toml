[package]
name = "birchpad-buffer"
description = "Birchpad's buffer: one open document, its file, its syntax and its marks, shared by the views that show it. No window."
version = "0.8.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
birchpad-config.workspace = true
birchpad-core.workspace = true
birchpad-io.workspace = true
birchpad-syntax.workspace = true
birchpad-tools.workspace = true
birchpad-ui.workspace = true
gpui-kit = "0.8"

[dev-dependencies]
birchpad-ui = { workspace = true, features = ["test-support"] }
gpui-kit = { version = "0.8", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
