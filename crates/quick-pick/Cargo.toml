[package]
name = "birchpad-quick-pick"
description = "Birchpad's list to pick from by typing, which the command palette and Go to File show."
version = "0.7.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
birchpad-core.workspace = true
birchpad-editor.workspace = true
gpui-kit = "0.7"

[features]
# The list last opened, for the tests of the application to drive.
test-support = []

[dev-dependencies]
birchpad-quick-pick = { path = ".", features = ["test-support"] }
gpui-kit = { version = "0.7", features = ["test-support"] }

[lints]
workspace = true
