[package]
name = "birchpad-update"
description = "Birchpad updates: the signed update manifest, channels, version comparison, and installing updates (Velopack on Windows). No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.22"
birchpad-config.workspace = true
ed25519-dalek = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }

[features]
# Per-user installs update themselves with Velopack, on Windows (`install`). The application
# enables it; the release tool does not need it.
installer = ["dep:velopack"]

# The version matches the `vpk` tool the release workflows package with (ADR 0020).
[target.'cfg(windows)'.dependencies]
velopack = { version = "=1.2.161", features = ["public-utils"], optional = true }

[dev-dependencies]
tempfile = "3"

# build.rs checks the trusted keys with the library's own code (src/keys.rs).
[build-dependencies]
base64 = "0.22"
ed25519-dalek = "3"

[lints]
workspace = true
