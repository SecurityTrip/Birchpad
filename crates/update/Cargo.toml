[package]
name = "birchpad-update"
description = "Checking for Birchpad updates: release feeds, channels and version comparison."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
birchpad-config.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }

