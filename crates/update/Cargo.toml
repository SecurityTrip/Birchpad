[package]
name = "birchpad-update"
description = "Birchpad updates: the signed update manifest, channels, version comparison, and installing updates (Velopack on Windows). No UI."
version = "0.7.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
birchpad-i18n.workspace = true
base64 = "0.23"
birchpad-config.workspace = true
ed25519-dalek = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
# Plugins from the online catalog and the components (PlantUML) come as ZIPs; the features
# Velopack builds. At least 9.0.5, which fixes GHSA-m665-v7pm-7grj: catalog plugins are
# archives of other authors.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[features]
# Per-user installs update themselves with Velopack, on Windows (`install`). The application
# enables it; the release tool does not need it.
installer = ["dep:velopack"]

# The version matches the `vpk` tool the release workflows package with (ADR 0020). A
# pre-release for now, the only one with zip 9 (GHSA-m665-v7pm-7grj); move to the first stable
# release that has zip 9.0.5 or later in its Cargo.lock, which its Update.exe is built with.
[target.'cfg(windows)'.dependencies]
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"], optional = true }

[dev-dependencies]
# The tests of the Velopack installer too.
birchpad-update = { path = ".", features = ["installer"] }
tempfile = "3"

# build.rs checks the trusted keys with the library's own code (src/keys.rs).
[build-dependencies]
base64 = "0.23"
ed25519-dalek = "3"

[lints]
workspace = true
