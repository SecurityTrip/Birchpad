context = "Editor"

[[binding]]
keys = "backspace"
command = "edit.backspace"
context = "Editor"

[[binding]]
keys = "alt-backspace"
command = "edit.delete-word-left"
context = "Editor"
platforms = ["macos"]

[[binding]]
keys = "ctrl-backspace"
command = "edit.delete-word-left"
context = "Editor"
platforms = ["windows", "linux"]

[[binding]]
keys = "ctrl-delete"
command = "edit.delete-word-right"
context = "Editor"
platforms = ["windows", "linux"]

[[binding]]
keys = "alt-delete"
command = "edit.delete-word-right"
context = "Editor"
platforms = ["macos"]

[[binding]]
keys = "shift-enter"
command = "edit.newline"
context = "Editor"

[[binding]]
keys = "enter"
command = "edit.newline"
context = "Editor"

[[binding]]
keys = "tab"
