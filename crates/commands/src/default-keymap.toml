# Token styles, as in Notepad++: Ctrl+Alt+N styles every occurrence of the token with style N,
# Ctrl+Alt+Shift+N clears it, Ctrl+N and Ctrl+Shift+N jump to its next and previous occurrence.
# macOS takes Cmd+Shift+3/4/5 for screenshots, so jumping up is Cmd+Ctrl+N there.

[[binding]]
keys = "secondary-alt-1"
command = "mark.style-all"
