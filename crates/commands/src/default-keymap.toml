# Birchpad's default key bindings, modeled on Notepad++.
#
# Each [[binding]] maps `keys` to a `command` from the catalog, with optional `args`. Optional
# fields:
#   context   - only active when that UI context has focus ("Editor"); global otherwise
#   platforms - limit to some of "windows", "linux", "macos"
#   unbind    - remove an earlier binding of the same keys and context (user keymaps)
#
# `secondary` is Ctrl on Windows and Linux and Cmd on macOS.
#
# When a command has several bindings, menus show the last one, so alternates come first.

# --- File ---------------------------------------------------------------------------------------

[[binding]]
keys = "secondary-n"
command = "file.new"

[[binding]]
keys = "secondary-o"
command = "file.open"

[[binding]]
keys = "secondary-s"
command = "file.save"

[[binding]]
keys = "secondary-alt-s"
command = "file.save-as"

[[binding]]
keys = "secondary-shift-s"
command = "file.save-all"

[[binding]]
keys = "ctrl-f4"
command = "file.close"
platforms = ["windows", "linux"]

[[binding]]
keys = "secondary-w"
command = "file.close"

[[binding]]
keys = "secondary-shift-w"
command = "file.close-all"

[[binding]]
keys = "cmd-q"
command = "file.exit"
platforms = ["macos"]

# --- Search -------------------------------------------------------------------------------------

[[binding]]
keys = "secondary-f"
command = "search.find"

[[binding]]
keys = "secondary-h"
command = "search.replace"

[[binding]]
keys = "f3"
command = "search.find-next"

[[binding]]
keys = "shift-f3"
command = "search.find-previous"

[[binding]]
keys = "secondary-g"
command = "search.go-to"

# --- View ---------------------------------------------------------------------------------------

# Windows reports the keypad +, - and 0 as "+", "-" and "0"; Linux as "add", "subtract" and "0".

[[binding]]
keys = "secondary-="
command = "view.zoom-in"

[[binding]]
keys = "secondary-add"
command = "view.zoom-in"

[[binding]]
keys = "secondary-+"
command = "view.zoom-in"

[[binding]]
keys = "secondary-subtract"
command = "view.zoom-out"

[[binding]]
keys = "secondary--"
command = "view.zoom-out"

[[binding]]
keys = "secondary-divide"
command = "view.zoom-reset"

[[binding]]
keys = "secondary-0"
command = "view.zoom-reset"

[[binding]]
keys = "ctrl-pagedown"
command = "view.next-tab"

[[binding]]
keys = "ctrl-tab"
command = "view.next-tab"

[[binding]]
keys = "ctrl-pageup"
command = "view.previous-tab"

[[binding]]
keys = "ctrl-shift-tab"
command = "view.previous-tab"

