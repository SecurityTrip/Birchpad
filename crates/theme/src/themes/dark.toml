# Birchpad's built-in dark theme. Theme files with a dark editor background take the colors
# they do not set from here.

[editor]
text = "#d4d4d4"
background = "#1e1e1e"
selection = "#264f78"
caret = "#aeafad"
current-line = "#2a2d2e"
gutter-background = "#1e1e1e"
gutter-text = "#858585"
gutter-border = "#333333"
bookmark = "#3794ff"
change-modified = "#e2a03f"
change-saved = "#3fb950"
fold-mark = "#a0a0a0"
fold-line = "#404040"
fold-underline = "#707070"
whitespace = "#5a5a5a"
eol-box = "#3a3a3a"
eol-text = "#a0a0a0"
indent-guide = "#404040"
edge = "#3a4a4a"
brace-match = "#ffd700"
brace-bad = "#f44747"
smart-highlight = "#3fb95040"
find-mark = "#f4474755"
incremental-highlight = "#3794ff55"
mark-1 = "#00ffff40"
mark-2 = "#ff800050"
mark-3 = "#ffff0040"
mark-4 = "#a070ff50"
mark-5 = "#3fb95050"
scrollbar-thumb = "#4e4e4e"

[ui]
background = "#1e1e1e"
surface = "#252526"
border = "#3c3c3c"
text = "#d4d4d4"
muted = "#9da5b4"
faint = "#6e7681"
selected = "#04395e"
hovered = "#2a2d2e"
accent = "#3794ff"
error = "#f85149"
error-background = "#5a1d1d"
modified = "#f0883e"
directory = "#d29922"
heading = "#2d333b"
line-number = "#3fb950"
match-background = "#613a00"

[syntax]
attribute = "#9cdcfe"
boolean = "#569cd6"
character = "#ce9178"
comment = "#6a9955"
constant = "#4fc1ff"
"constant.builtin" = "#569cd6"
constructor = "#4ec9b0"
"diff.delta" = "#569cd6"
"diff.minus" = "#f44747"
"diff.plus" = "#6a9955"
error = "#f44747"
escape = "#d7ba7d"
function = "#dcdcaa"
"function.macro" = "#c586c0"
keyword = "#569cd6"
"keyword.directive" = "#c586c0"
label = "#c8c8c8"
"markup.heading" = { color = "#569cd6", bold = true }
"markup.italic" = { italic = true }
"markup.link" = "#3794ff"
"markup.list" = "#6796e6"
"markup.quote" = { color = "#6a9955", italic = true }
"markup.raw" = "#ce9178"
"markup.strong" = { bold = true }
module = "#4ec9b0"
number = "#b5cea8"
operator = "#d4d4d4"
property = "#9cdcfe"
string = "#ce9178"
"string.escape" = "#d7ba7d"
"string.regexp" = "#d16969"
"string.special.key" = "#9cdcfe"
tag = "#569cd6"
"tag.attribute" = "#9cdcfe"
type = "#4ec9b0"
"variable.builtin" = "#569cd6"
