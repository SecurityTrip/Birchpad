[package]
name = "birchpad-release-tool"
description = "Release tooling for Birchpad: update signing keys and the signed update manifest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "birchpad-release"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
birchpad-update.workspace = true
ed25519-dalek = "3"
getrandom = "0.3"
semver = "1"
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"

# The `icons` example renders the application icon (the version GPUI uses).
[dev-dependencies]
resvg = { version = "0.46", default-features = false }
tempfile = "3"

[lints]
workspace = true
