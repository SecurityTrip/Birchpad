[package]
name = "birchpad-panels"
description = "Birchpad's side panels of the documents: Document List, Function List, Document Map, the JSON viewer, Clipboard History and the Character Panel."
version = "0.8.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
birchpad-core.workspace = true
birchpad-editor.workspace = true
birchpad-i18n.workspace = true
birchpad-io.workspace = true
birchpad-syntax.workspace = true
birchpad-tools.workspace = true
birchpad-ui.workspace = true
birchpad-view.workspace = true
birchpad-widgets.workspace = true
gpui-kit = "0.8"

[features]
# What the application's tests set of a panel.
test-support = []

[dev-dependencies]
birchpad-panels = { path = ".", features = ["test-support"] }
gpui-kit = { version = "0.8", features = ["test-support"] }

[lints]
workspace = true
