[package]
name = "birchpad-tools"
description = "Birchpad's built-in tools without a window: JSON and XML formatting, hex dumps, comparing texts, spell checking."
version = "0.7.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
birchpad-core.workspace = true
birchpad-i18n.workspace = true
birchpad-theme.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
fancy-regex = "0.20"
roxmltree = "0.21"
similar.workspace = true
spellbook = "0.4"
thiserror.workspace = true

[dev-dependencies]
# Tests switch the language each in its own thread.
birchpad-i18n = { workspace = true, features = ["per-thread"] }
proptest.workspace = true

[lints]
workspace = true
