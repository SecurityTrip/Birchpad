[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SecurityTrip/Birchpad"
authors = ["The Birchpad Contributors"]

[workspace.dependencies]
birchpad-cli = { path = "crates/cli", version = "0.1.0" }
birchpad-commands = { path = "crates/commands", version = "0.1.0" }
birchpad-config = { path = "crates/config", version = "0.1.0" }
birchpad-core = { path = "crates/core", version = "0.1.0" }
birchpad-io = { path = "crates/io", version = "0.1.0" }
birchpad-view = { path = "crates/view", version = "0.1.0" }

anyhow = "1"
proptest = "1.11"
ropey = { version = "=2.0.0-beta.1", features = ["metric_utf16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15"
thiserror = "2"
toml = "1.1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
