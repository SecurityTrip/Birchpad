[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SecurityTrip/Birchpad"
authors = ["The Birchpad Contributors"]

[workspace.dependencies]
birchpad-config = { path = "crates/config" }
birchpad-core = { path = "crates/core" }

proptest = "1.11"
ropey = "=2.0.0-beta.1"
serde = { version = "1", features = ["derive"] }
smallvec = "1.15"
thiserror = "2"
toml = "1.1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
